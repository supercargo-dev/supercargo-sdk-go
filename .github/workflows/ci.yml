name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.11', '1.27.4']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Module Integrity
        run: go mod verify

      - name: Verify No Toolchain Directive Leak
        run: |
          if grep -q '^toolchain' go.mod; then
            echo "Error: supercargo-sdk-go/go.mod must not contain a toolchain directive" >&2
            exit 1
          fi

      - name: Check Go Format
        run: |
          test -z "$(gofmt -l .)" || (echo "Unformatted files found:" && gofmt -l . && exit 1)

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests with Race Detector & Coverage
        run: go test -v -race -coverprofile=coverage.txt ./sc ./clients .

      - name: Verify Example Code Compilation
        run: go build -v ./example/main.go
